<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KasKu — A Simple Monthly Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Material Symbols Outlined -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-zinc-950 dark:text-slate-100 transition-colors duration-200">
    <div class="max-w-5xl mx-auto p-4 md:p-6 lg:p-8">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 dark:text-white">KasKu Finance Tracker</h1>
            <div class="flex items-center gap-4">
                <button id="themeToggle" class="p-2 rounded-lg bg-slate-000 dark:bg-slate-000 text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-600 transition shadow-sm flex items-center justify-center">
                    <span id="themeIcon" class="material-symbols-outlined text-xl select-none">dark_mode</span>
                </button>
            </div>
        </div>
        
        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white dark:bg-zinc-900 rounded-xl shadow-sm border border-slate-400 dark:border-slate-700 p-6 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-green-500"></div>
                <h3 class="text-slate-500 dark:text-slate-400 text-sm uppercase font-semibold tracking-wider">Total Pemasukan</h3>
                <p class="text-3xl font-bold text-green-600 dark:text-green-400 mt-2" id="totalIncome">Rp 0</p>
            </div>
            <div class="bg-white dark:bg-zinc-900 rounded-xl shadow-sm border border-slate-400 dark:border-slate-700 p-6 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-rose-500"></div>
                <h3 class="text-slate-500 dark:text-slate-400 text-sm uppercase font-semibold tracking-wider">Total Pengeluaran</h3>
                <p class="text-3xl font-bold text-rose-600 dark:text-rose-400 mt-2" id="totalExpense">Rp 0</p>
            </div>
            <div class="bg-white dark:bg-zinc-900 rounded-xl shadow-sm border border-slate-400 dark:border-slate-700 p-6 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
                <h3 class="text-slate-500 dark:text-slate-400 text-sm uppercase font-semibold tracking-wider">Sisa Saldo</h3>
                <p class="text-3xl font-bold text-blue-600 dark:text-blue-400 mt-2" id="totalBalance">Rp 0</p>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="bg-white dark:bg-zinc-900 rounded-xl shadow-sm border border-slate-400 dark:border-slate-700 p-6 mb-8">
            <h2 class="text-xl font-semibold mb-5 text-slate-700 dark:text-slate-200">Tambah Transaksi Baru</h2>
            <form id="transactionForm" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                <!-- Baris Pertama (Desktop) -->
                <div class="md:col-span-4">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Tanggal</label>
                    <input type="date" id="date" required class="w-full bg-white dark:bg-slate-700 border-slate-400 dark:border-slate-600 text-slate-900 dark:text-white rounded-lg shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                <div class="md:col-span-8">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Keterangan</label>
                    <input type="text" id="description" required placeholder="Contoh: Gaji, Makan, Listrik" class="w-full bg-white dark:bg-slate-700 border-slate-400 dark:border-slate-600 text-slate-900 dark:text-white rounded-lg shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                
                <!-- Baris Kedua (Desktop) -->
                <div class="md:col-span-4">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Jenis</label>
                    <select id="type" class="w-full bg-white dark:bg-slate-700 border-slate-400 dark:border-slate-600 text-slate-900 dark:text-white rounded-lg shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        <option value="income">Pemasukan</option>
                        <option value="expense">Pengeluaran</option>
                    </select>
                </div>
                <div class="md:col-span-4">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Nominal (Rp)</label>
                    <input type="text" id="amountDisplay" required placeholder="0" class="w-full bg-white dark:bg-slate-700 border-slate-400 dark:border-slate-600 text-slate-900 dark:text-white rounded-lg shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                <div class="md:col-span-4">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg transition shadow-sm">
                        Simpan
                    </button>
                </div>
            </form>
        </div>

        <!-- Transaction List & Export -->
        <div class="bg-white dark:bg-zinc-900 rounded-xl shadow-sm border border-slate-400 dark:border-slate-700 p-6 overflow-hidden">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <h2 class="text-xl font-semibold text-slate-700 dark:text-slate-200">Riwayat Transaksi</h2>
                <div class="flex gap-2 w-full sm:w-auto">
                    <!-- Tombol Hapus Semua -->
                    <button onclick="clearAllTransactions()" class="bg-red-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-red-700 transition flex items-center gap-2 shadow-sm text-sm flex-1 sm:flex-none justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        Hapus Semua
                    </button>
                    <!-- Tombol Export Excel -->
                    <button onclick="exportToExcel()" class="bg-emerald-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-emerald-700 transition flex items-center gap-2 shadow-sm text-sm flex-1 sm:flex-none justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        Export
                    </button>
                </div>
            </div>
            
            <!-- KODE FILTER -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 bg-slate-50 dark:bg-zinc-900/50 p-4 rounded-lg border border-slate-400 dark:border-slate-700">
                <!-- Filter Keterangan -->
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Cari Keterangan</label>
                    <input type="text" id="filterDescription" placeholder="Ketik kata kunci..." class="w-full bg-white dark:bg-slate-700 border-slate-400 dark:border-slate-600 text-slate-900 dark:text-white rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
                </div>
                <!-- Filter Jenis -->
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Filter Jenis</label>
                    <select id="filterType" class="w-full bg-white dark:bg-slate-700 border-slate-400 dark:border-slate-600 text-slate-900 dark:text-white rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
                        <option value="all">Semua Jenis</option>
                        <option value="income">Pemasukan Saja</option>
                        <option value="expense">Pengeluaran Saja</option>
                    </select>
                </div>
                <!-- Sort Tanggal -->
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Urutkan Tanggal</label>
                    <select id="sortDate" class="w-full bg-white dark:bg-slate-700 border-slate-400 dark:border-slate-600 text-slate-900 dark:text-white rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
                        <option value="desc">Terbaru ke Terlama</option>
                        <option value="asc">Terlama ke Terbaru</option>
                    </select>
                </div>
            </div>

            <div class="overflow-x-auto rounded-lg border border-slate-400 dark:border-slate-700">
                <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-700">
                    <thead class="bg-slate-50 dark:bg-slate-700">
                        <tr>
                            <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wider">Tanggal</th>
                            <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wider">Keterangan</th>
                            <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wider">Jenis</th>
                            <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wider">Nominal</th>
                            <th class="px-6 py-3.5 text-right text-xs font-semibold text-slate-500 dark:text-slate-300 uppercase tracking-wider">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="transactionList" class="bg-white dark:bg-zinc-900 divide-y divide-slate-200 dark:divide-slate-700">
                        <!-- Rows -->
                    </tbody>
                </table>
                <div id="emptyState" class="text-center py-12 text-slate-500 dark:text-slate-400 hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-slate-300 dark:text-slate-600 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    Belum ada transaksi tercatat.
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-10 mb-4 text-center text-sm font-medium text-slate-500 dark:text-slate-400">
            &copy; 2026 - Gitakara Ardhytama
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
